name: CUDA Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-nvcc:
    name: nvcc Linux x64 sm_89
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc","cudart"]'
          use-github-cache: false

      - name: Build miner
        env:
          CUDA_ARCH: sm_89
          CUDA_SIGN_BATCH: "128"
        run: ./build_cuda.sh

      - name: Upload miner binary
        uses: actions/upload-artifact@v4
        with:
          name: btcw-cuda-miner-linux-x64-sm89
          path: release/btcw_cuda_miner
