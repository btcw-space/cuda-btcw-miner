name: CUDA Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-nvcc:
    name: nvcc Windows x64 sm_89
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc","cudart"]'

      - name: Build miner
        shell: cmd
        env:
          CUDA_ARCH: sm_89
          CUDA_SIGN_BATCH: "128"
        run: build_cuda.bat

      - name: Upload miner binary
        uses: actions/upload-artifact@v4
        with:
          name: btcw-cuda-miner-windows-x64-sm89
          path: release/btcw_cuda_miner.exe
